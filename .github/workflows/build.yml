name: Build SpotifyCraft

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Prepare intermediary source mappings
        run: python3 scripts/prepare_intermediary_mappings.py

      - name: Build mod
        run: gradle clean build --no-daemon

      - name: Verify remapped mod JAR
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t jars < <(
            find build/libs -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-dev.jar' \
              ! -name '*-sources.jar' \
              | sort
          )

          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "Expected exactly one remapped mod JAR, found ${#jars[@]}."
            find build/libs -maxdepth 1 -type f -print || true
            exit 1
          fi

          jar_file="${jars[0]}"
          jar tf "$jar_file" | grep -Fxq 'fabric.mod.json'
          jar tf "$jar_file" | grep -Fxq 'neonlyrics.mixins.json'
          jar tf "$jar_file" | grep -Fxq 'dev/neonlyrics/NeonLyrics.class'

          echo "Verified mod JAR: $jar_file"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: spotifycraft-1.21.11
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download mod JAR
        uses: actions/download-artifact@v4
        with:
          name: spotifycraft-1.21.11
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
